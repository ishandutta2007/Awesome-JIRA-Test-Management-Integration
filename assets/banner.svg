<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#001845"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052CC"/>
      <stop offset="50%" stop-color="#2684FF"/>
      <stop offset="100%" stop-color="#00C7E6"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a4a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="tag-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36B37E"/>
      <stop offset="100%" stop-color="#00875A"/>
    </linearGradient>

    <linearGradient id="tag-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6554C0"/>
      <stop offset="100%" stop-color="#8777D9"/>
    </linearGradient>

    <linearGradient id="tag-grad-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5630"/>
      <stop offset="100%" stop-color="#FF7452"/>
    </linearGradient>

    <!-- Filter for soft neon glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2684FF" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes badgeFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }
    .orb-1 { animation: pulseOrb 8s infinite ease-in-out; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s infinite ease-in-out reverse; transform-origin: 1000px 300px; }
    .particle-1 { animation: floatParticle 6s infinite ease-in-out; }
    .particle-2 { animation: floatParticle 8s infinite ease-in-out 1s; }
    .particle-3 { animation: floatParticle 7s infinite ease-in-out 2s; }
    .wire-flow { stroke-dasharray: 12, 12; animation: flowLine 20s linear infinite; }
    .badge-card { animation: badgeFloat 5s infinite ease-in-out; }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Dynamic Animated Background Glow Elements (Behind Text) -->
  <g id="dynamic-bg-glows">
    <circle class="orb-1" cx="180" cy="120" r="140" fill="#0052CC" filter="url(#glow)"/>
    <circle class="orb-2" cx="1020" cy="300" r="160" fill="#00C7E6" filter="url(#glow)"/>
    <circle class="particle-1" cx="320" cy="360" r="4" fill="#36B37E"/>
    <circle class="particle-2" cx="880" cy="90" r="5" fill="#2684FF"/>
    <circle class="particle-3" cx="600" cy="40" r="3" fill="#FFC400"/>
    <circle class="particle-1" cx="150" cy="320" r="4" fill="#6554C0"/>
    <circle class="particle-2" cx="1060" cy="140" r="4.5" fill="#00C7E6"/>

    <!-- Subtle Animated Circuit/Sync Lines -->
    <path class="wire-flow" d="M 80 340 Q 300 390 600 370 T 1120 350" fill="none" stroke="#2684FF" stroke-width="2" stroke-opacity="0.35"/>
    <path class="wire-flow" d="M 120 70 Q 500 20 800 60 T 1100 80" fill="none" stroke="#00C7E6" stroke-width="1.5" stroke-opacity="0.25"/>
  </g>

  <!-- Foreground Content Layer: Clear, Crisply Legible, Never Obscured -->
  <g id="foreground-content" transform="translate(60, 40)">
    
    <!-- Top Pill / Category Tag -->
    <g transform="translate(400, 10)">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="#0052CC" fill-opacity="0.35" stroke="#2684FF" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="6" fill="#36B37E"/>
      <text x="32" y="21" fill="#DEEBFF" font-size="12" class="text-sub" letter-spacing="1.5" font-weight="600">ENTERPRISE QA &amp; JIRA ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text class="text-title" x="540" y="105" text-anchor="middle" font-size="44" fill="#FFFFFF" letter-spacing="-0.5">
      Awesome Jira Test Management
    </text>
    <text class="text-title" x="540" y="148" text-anchor="middle" font-size="34" fill="url(#primary-glow)">
      &amp; Quality Engineering Integration
    </text>

    <!-- Subtitle / Tagline -->
    <text class="text-sub" x="540" y="195" text-anchor="middle" font-size="16.5" fill="#B3D4FF" letter-spacing="0.2">
      Curated Catalog of SaaS Platforms, Test Automation Frameworks &amp; Open-Source QA Orchestration
    </text>

    <!-- Feature Value Cards (Floating Metrics / Pillars) -->
    <g transform="translate(90, 230)">
      <!-- Card 1 -->
      <g class="badge-card" transform="translate(0, 0)">
        <rect width="210" height="74" rx="10" fill="url(#card-grad)" stroke="#2684FF" stroke-width="1" stroke-opacity="0.5"/>
        <circle cx="28" cy="37" r="14" fill="#0052CC" fill-opacity="0.4"/>
        <text x="28" y="42" font-size="14" text-anchor="middle" fill="#2684FF">⚡</text>
        <text x="54" y="32" fill="#FFFFFF" font-size="14" class="text-title">Test Management</text>
        <text x="54" y="52" fill="#8993A4" font-size="11.5" class="text-sub">Xray, Zephyr, TestRail</text>
      </g>

      <!-- Card 2 -->
      <g class="badge-card" transform="translate(235, 0)" style="animation-delay: 1.2s;">
        <rect width="210" height="74" rx="10" fill="url(#card-grad)" stroke="#36B37E" stroke-width="1" stroke-opacity="0.5"/>
        <circle cx="28" cy="37" r="14" fill="#36B37E" fill-opacity="0.3"/>
        <text x="28" y="42" font-size="14" text-anchor="middle" fill="#36B37E">🔗</text>
        <text x="54" y="32" fill="#FFFFFF" font-size="14" class="text-title">End-to-End Trace</text>
        <text x="54" y="52" fill="#8993A4" font-size="11.5" class="text-sub">Epics &amp; Defect Sync</text>
      </g>

      <!-- Card 3 -->
      <g class="badge-card" transform="translate(470, 0)" style="animation-delay: 2.4s;">
        <rect width="210" height="74" rx="10" fill="url(#card-grad)" stroke="#6554C0" stroke-width="1" stroke-opacity="0.5"/>
        <circle cx="28" cy="37" r="14" fill="#6554C0" fill-opacity="0.3"/>
        <text x="28" y="42" font-size="14" text-anchor="middle" fill="#8777D9">🚀</text>
        <text x="54" y="32" fill="#FFFFFF" font-size="14" class="text-title">CI/CD Automation</text>
        <text x="54" y="52" fill="#8993A4" font-size="11.5" class="text-sub">JUnit, Playwright, Allure</text>
      </g>

      <!-- Card 4 -->
      <g class="badge-card" transform="translate(705, 0)" style="animation-delay: 3.6s;">
        <rect width="195" height="74" rx="10" fill="url(#card-grad)" stroke="#00C7E6" stroke-width="1" stroke-opacity="0.5"/>
        <circle cx="28" cy="37" r="14" fill="#00C7E6" fill-opacity="0.3"/>
        <text x="28" y="42" font-size="14" text-anchor="middle" fill="#00C7E6">⭐</text>
        <text x="54" y="32" fill="#FFFFFF" font-size="14" class="text-title">Open-Source QA</text>
        <text x="54" y="52" fill="#8993A4" font-size="11.5" class="text-sub">Kiwi, Plane, DevLake</text>
      </g>
    </g>

    <!-- Bottom Metadata Status Bar -->
    <g transform="translate(280, 325)">
      <text x="0" y="0" fill="#6B778C" font-size="12" class="text-sub">
        🔍 10+ Enterprise SaaS Evaluated  •  📊 20+ Open-Source Projects Star-Ranked  •  🌐 Bi-Directional Jira Sync
      </text>
    </g>
  </g>
</svg>